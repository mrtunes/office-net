[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "office-net"
version = "0.2.0"
description = "Office Network Tool – scan the LAN and connect to machines."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
office-net = "office_net.__main__:main"
